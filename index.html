<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TopControl — Temperatur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#060d1c;--side:#081226;--card:#0c1830;--card2:#0f1d3a;--line:#1b2c4d;--line2:#24395f;
    --text:#e8eefb;--muted:#8a9bbb;--dim:#5f7092;
    --cyan:#1ec8ff;--blue:#1f8bff;--green:#2fd36b;--red:#ff4d5e;--amber:#f5a524;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex}
  button,input{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}

  aside{width:250px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;padding:0 8px 26px}
  .logo b{font-size:21px;font-weight:700;letter-spacing:-.3px}
  .logo small{display:block;font-size:9.5px;letter-spacing:2.2px;color:var(--cyan);font-weight:600;margin-top:-2px}
  nav a{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;color:#c9d4ea;margin-bottom:6px;font-weight:500;cursor:pointer}
  nav a:hover{background:#0f1f3d}
  nav a.act{background:linear-gradient(90deg,#1aa3ff,#1e7cff);color:#fff;box-shadow:0 6px 22px rgba(30,140,255,.35)}
  nav svg{width:22px;height:22px;flex:none}
  .navbadge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px;display:none}
  .sidebox{margin-top:auto;border:1px solid var(--line2);background:linear-gradient(160deg,#0e2142,#091631);border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center}
  .sidebox b{display:block;font-size:14px}
  .sidebox span{font-size:11px;color:var(--muted)}

  .wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
  .top{display:flex;align-items:center;gap:12px;padding:18px 28px 0}
  .pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
  .pill input{width:58px;background:transparent;border:0;outline:0;font-weight:600;font-size:15px}
  .pill label{font-size:12px;color:var(--muted)}
  .thrchip{cursor:pointer;color:var(--muted);font-size:13px}
  .thrchip b{color:var(--text);font-size:15px}
  .thrchip:hover{border-color:var(--cyan)}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  .pill .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
  .grow{flex:1}
  .livebar{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:1px solid var(--line2);background:linear-gradient(90deg,#0e2142,#091631);border-radius:14px;padding:8px 18px}
  .livebar .lt{min-width:0}
  .livebar .lt b{display:block;font-size:14px;white-space:nowrap}
  .livebar .lt span{font-size:12px;color:var(--muted);white-space:nowrap}
  .livebar .lv{font-size:13px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .livebar .lv b{color:var(--text);font-variant-numeric:tabular-nums}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,211,107,.6);animation:pl 1.8s infinite}
  @keyframes pl{0%{box-shadow:0 0 0 0 rgba(47,211,107,.6)}70%{box-shadow:0 0 0 9px rgba(47,211,107,0)}100%{box-shadow:0 0 0 0 rgba(47,211,107,0)}}
  @media(max-width:1280px){.livebar .lv{display:none}}
  .flags{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px}
  .flag{width:32px;height:22px;border-radius:5px;overflow:hidden;cursor:pointer;opacity:.45;border:1px solid transparent;padding:0;background:none;display:block}
  .flag svg{display:block;width:100%;height:100%}
  .flag:hover{opacity:.8}
  .flag.on{opacity:1;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(30,200,255,.25)}
  .iconbtn{position:relative;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
  .iconbtn.on{border-color:var(--cyan);color:var(--cyan)}
  .iconbtn .dotb{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);font-size:10px;font-weight:700;display:none;place-items:center;padding:0 4px}
  .user{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--line)}
  .ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1ec8ff,#1f6bff);display:grid;place-items:center;font-weight:700}
  .user b{font-size:13px}

  .content{padding:18px 28px 18px;display:flex;flex-direction:column;gap:18px}

  .hero{position:relative;overflow:hidden;border-radius:20px;border:1px solid #1d4d8a;min-height:176px;
    background:radial-gradient(800px 260px at 78% 60%,rgba(30,200,255,.28),transparent 60%),linear-gradient(100deg,#07142c 0%,#0a1f45 55%,#0c2a5c 100%);
    box-shadow:inset 0 0 0 1px rgba(30,200,255,.12),0 0 40px rgba(30,140,255,.12)}
  .hero .art{position:absolute;inset:0;z-index:1}
  .hero{min-height:340px}
  .himg{position:absolute;top:0;right:0;bottom:0;width:84%;background-size:cover;background-position:center 52%}
  .hfade{position:absolute;inset:0;background:linear-gradient(90deg,#07142c 0%,#07142c 16%,rgba(7,20,44,.85) 22%,rgba(7,20,44,.4) 32%,rgba(7,20,44,0) 44%)}
  .flake{z-index:2}
  .flake{position:absolute;color:#bfefff;opacity:0;animation:fall linear infinite}
  @keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translateY(200px) rotate(180deg);opacity:0}}

  /* ---------- vehicle detail ---------- */
  .det{display:none;flex-direction:column;gap:18px}
  .hero .dl{position:absolute;left:0;top:0;bottom:0;z-index:3;display:none;justify-content:center}
  .hero.unit .dl{display:flex}
  .hero.unit #hFleet{display:none}
  .hero.unit .hfade{background:linear-gradient(90deg,#07142c 0%,#07142c 16%,rgba(7,20,44,.9) 26%,rgba(7,20,44,.45) 40%,rgba(7,20,44,0) 54%)}
  .backbar{display:flex;align-items:center;gap:16px}
  .btn.back{padding:9px 16px;font-size:14px}
  .crumb{color:var(--muted)}
  .crumb b{color:var(--text)}
  .det.open{display:flex;animation:din .35s ease-out}
  @keyframes din{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .dhero{position:relative;overflow:hidden;border-radius:20px;border:1px solid #1d4d8a;min-height:300px;background:#071230;
    box-shadow:inset 0 0 0 1px rgba(30,200,255,.12),0 0 40px rgba(30,140,255,.12)}
  .dimg{position:absolute;top:0;right:0;bottom:0;width:66%;background-size:cover;background-position:center right}
  .dfade{position:absolute;inset:0;background:linear-gradient(90deg,#071230 0%,#071230 28%,rgba(7,18,48,.6) 40%,rgba(7,18,48,0) 52%),linear-gradient(0deg,rgba(7,18,48,.55),transparent 35%)}
  .dx{position:absolute;top:16px;right:16px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(8,18,40,.75);cursor:pointer;font-size:22px;line-height:1;display:grid;place-items:center}
  .dx:hover{border-color:var(--cyan)}
  .dl{position:relative;z-index:2;padding:24px 30px;display:flex;flex-direction:column;gap:8px;max-width:820px}
  .dpills{display:flex;gap:12px;align-items:center}
  .pon{display:flex;align-items:center;gap:8px;background:rgba(47,211,107,.16);border:1px solid rgba(47,211,107,.4);color:#d9ffe6;border-radius:12px;padding:6px 14px;font-weight:600}
  .pon i{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .pon.off{background:rgba(245,165,36,.14);border-color:rgba(245,165,36,.45);color:#ffe7bf}
  .pon.off i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .ptime{display:flex;align-items:center;gap:8px;background:rgba(10,24,52,.8);border:1px solid var(--line2);border-radius:12px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
  .dplate{font-size:54px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin-top:6px}
  .dtype{display:flex;align-items:center;gap:10px;color:#c3cde2;font-size:17px}
  .dtemps{display:flex;align-items:center;gap:18px;margin-top:12px;padding:14px 18px;border-radius:16px;border:1px solid var(--line2);background:rgba(10,22,48,.82);width:max-content;max-width:100%;flex-wrap:wrap}
  .dthermo{width:64px;height:64px;border-radius:14px;background:#0f2550;display:grid;place-items:center;color:var(--cyan)}
  .dv b{display:block;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .dv b.bad{color:var(--red)}
  .dv span{font-size:13px;color:var(--muted)}
  .vsep{width:1px;height:50px;background:var(--line2)}
  .dthr{display:flex;align-items:center;gap:10px}
  .dthr svg{color:var(--cyan)}
  .dthr b{font-size:24px}
  .dst{display:flex;align-items:center;gap:8px;border-radius:14px;padding:9px 16px;font-weight:700;background:rgba(47,211,107,.16);border:1px solid rgba(47,211,107,.45);color:#7dffab}
  .dst.bad{background:rgba(255,77,94,.16);border-color:rgba(255,77,94,.5);color:#ff8f99}
  .dst.na{background:rgba(138,155,187,.12);border-color:var(--line2);color:var(--muted)}
  .drow{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px}
  .seg{display:flex;gap:4px;background:#0a1530;border:1px solid var(--line2);border-radius:12px;padding:4px}
  .seg span{padding:5px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
  .seg span.on{background:var(--blue);color:#fff}
  .steprow{display:flex;align-items:center;gap:12px;padding:12px 22px 0;color:var(--muted);font-size:13px}
  .seg .cust{display:flex;align-items:center;gap:4px;padding:0 8px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px}
  .seg .cust.on{background:var(--blue);color:#fff}
  .seg .cust span{padding:0;color:inherit}
  .seg .cust.on span{color:#fff;background:none}
  .seg .cust input{width:52px;background:#0f2550;border:1px solid var(--line2);border-radius:7px;padding:3px 6px;outline:0;color:var(--text);text-align:center}
  .cwrap{position:relative;height:270px;padding:12px 18px 14px}
  .cmsg{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);font-size:14px}
  .cmsg.on{display:grid}
  .irow{display:flex;align-items:center;gap:16px;padding:16px 20px;border-top:1px solid var(--line)}
  .irow:first-child{border-top:0}
  .iic{width:50px;height:50px;border-radius:13px;background:#0f2550;display:grid;place-items:center;color:var(--cyan);flex:none}
  .ibody{flex:1;min-width:0}
  .ibody .lb{color:#c3cde2;font-size:14px}
  .ibody .vl{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibar{height:7px;border-radius:4px;background:#13284d;margin-top:8px;overflow:hidden}
  .ibar i{display:block;height:100%;border-radius:4px}
  .ival{font-weight:700;font-size:18px;white-space:nowrap}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:18px;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
  .card-h h2{margin:0;font-size:18px;font-weight:600}
  .card-h .ic{color:var(--cyan)}
  .ctl{display:flex;align-items:center;gap:8px;background:#0a1530;border:1px solid var(--line2);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:13px}
  .ctl.on{border-color:var(--cyan);color:var(--cyan)}
  .ctl input{background:transparent;border:0;outline:0;width:130px}

  table{width:100%;border-collapse:collapse}
  th{font-size:14px;font-weight:500;color:var(--muted);text-align:left;padding:12px 22px;background:#0b1631;position:sticky;top:0;z-index:1}
  td{padding:10px 22px;border-top:1px solid var(--line);white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:rgba(30,200,255,.06)}
  tr.sel td{background:rgba(30,140,255,.16)!important}
  td.num{font-variant-numeric:tabular-nums;font-weight:500}
  td.bad{background:linear-gradient(90deg,rgba(255,77,94,.32),rgba(255,77,94,.14))!important;color:#ff6b78;font-weight:600}
  td.na{color:var(--dim)}
  td.time{color:#c3cde2;font-variant-numeric:tabular-nums}
  td.time.stale{color:var(--amber)}
  tr.flash td:not(.bad){animation:fl 1.1s}
  @keyframes fl{from{background:rgba(30,200,255,.16)}to{background:transparent}}
  .tbl{max-height:52vh;overflow:auto}
  .tbl::-webkit-scrollbar,.loglist::-webkit-scrollbar{width:8px}.tbl::-webkit-scrollbar-thumb,.loglist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  .empty{padding:24px 22px;color:var(--muted)}
  .jbar{display:flex;align-items:center;gap:14px;margin:12px 14px 14px;padding:10px 14px;background:#0a1530;border:1px solid var(--line);border-radius:12px}
  .jbar b{font-weight:600}
  .jbar .last{color:#c3cde2;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{background:#10264d;border:1px solid var(--line2);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--cyan)}

  .kpis{display:flex;flex-direction:column;gap:12px}
  .kpi{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(120deg,#0f1f40,#0b1731)}
  .kpi .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
  .kpi b{display:block;font-size:30px;font-weight:700;line-height:1.1}
  .kpi span{color:var(--muted);font-size:13px}
  .kpi .side{margin-left:auto;text-align:right;font-size:13px;font-weight:600}
  .kpi.blue{border-color:#1d5aa8}.kpi.green{border-color:#1f6a45}.kpi.red{border-color:#7a2a36}

  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);border:1px solid transparent}
  .tab.on{background:#10264d;border-color:var(--line2);color:var(--text)}
  .rank{display:flex;align-items:center;gap:14px;padding:10px 18px;border-top:1px solid var(--line);cursor:pointer}
  .rank:hover{background:rgba(30,200,255,.05)}
  .rank:first-child{border-top:0}
  .num-badge{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;background:#2b1d0c;color:var(--amber);border:1px solid #4a3312}
  .rank.good .num-badge{background:#0d2a1c;color:var(--green);border-color:#1d5a3b}
  .rank.badr .num-badge{background:#2d1117;color:var(--red);border-color:#5e2230}
  .rank .nm{font-weight:600}
  .rank .sub{font-size:12px;color:var(--muted)}
  .bar{height:5px;border-radius:3px;background:#13284d;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px}
  .rank .pct{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .note{font-size:11px;color:var(--dim);padding:8px 18px 12px}

  .loglist{max-height:46vh;overflow:auto}
  .loglist.big,.tbl.big{max-height:calc(100vh - 230px)}
  .page{display:none;flex-direction:column;gap:18px}
  .page.on{display:flex;animation:din .25s ease-out}
  .pbar{display:inline-block;width:70%;height:7px;border-radius:4px;background:#13284d;overflow:hidden;vertical-align:middle;margin-right:10px}
  .pbar i{display:block;height:100%;border-radius:4px}
  .lg{display:grid;grid-template-columns:150px 140px 1fr;gap:10px;padding:9px 22px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
  .lg:hover{background:rgba(30,200,255,.05)}
  .lg .p{color:#ff6b78;font-weight:600}
  .vt th{font-size:13px;padding:11px 16px}
  .vt td{padding:10px 16px;font-size:14px;vertical-align:top}
  .vt td.dev{color:#ff8f99;font-weight:700;font-variant-numeric:tabular-nums}
  .vt .snm{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
  .vt td.bad .snm{color:#ffb3ba}
  .maplink{display:inline-flex;align-items:center;gap:6px;color:#6cc4ff;font-variant-numeric:tabular-nums}
  .maplink:hover{text-decoration:underline;color:var(--cyan)}

  #settings{display:none;gap:18px;flex-wrap:wrap;align-items:flex-end;padding:16px 22px}
  #settings.open{display:flex}
  #settings label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
  #settings input{background:#0a1530;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;outline:0;width:180px}
  #settings p{flex-basis:100%;margin:0;font-size:12px;color:var(--dim)}

  footer{margin-top:auto;display:flex;align-items:center;gap:18px;padding:14px 28px;border-top:1px solid var(--line);color:#c3cde2;font-size:13px}
  footer .on{display:flex;align-items:center;gap:8px;font-weight:600}
  footer .on i{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  footer .on i.err{background:var(--red);box-shadow:0 0 8px var(--red)}
  footer .on i.demo{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .ver{margin-left:auto;border:1px solid var(--line2);border-radius:10px;padding:5px 12px;color:var(--green);font-weight:600}

  @media(max-width:1280px){.grid,.drow{grid-template-columns:minmax(0,1fr) 340px}.dplate{font-size:44px}}
  .mnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,18,38,.97);border-top:1px solid var(--line2);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
  .mnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;margin:0;border-radius:10px;font-size:11px;font-weight:500;color:var(--muted);position:relative;text-align:center}
  .mnav a svg{width:22px;height:22px}
  .mnav a.act{background:rgba(30,140,255,.14);color:var(--cyan);box-shadow:none}
  .mnav .navbadge{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
  @media(max-width:1050px){aside{display:none}.grid,.drow{grid-template-columns:minmax(0,1fr)}.dimg{width:100%;opacity:.35}
    .mnav{display:flex}
    .content{padding-bottom:96px}
    footer{padding-bottom:84px}
  }
  @media(max-width:760px){
    body{display:block;overflow-x:hidden}
    .top{padding:10px 12px 0;gap:8px}
    .livebar,.user b{display:none}
    .top .thrchip{margin-right:auto;padding:6px 10px;font-size:12px}
    .thrchip b{font-size:14px}
    .user{border:0;padding:0}
    .ava{width:36px;height:36px;font-size:13px}
    .iconbtn{width:38px;height:38px}
    .flags{padding:4px 6px;gap:4px}
    .flag{width:26px;height:18px}
    .content{padding:12px 12px 96px;gap:12px}
    .hero{min-height:200px;border-radius:16px}
    .himg{width:100%}
    .hfade{background:linear-gradient(90deg,rgba(7,20,44,.95) 0%,rgba(7,20,44,.65) 40%,rgba(7,20,44,.1) 85%)}
    #hFleet{left:4px!important}
    .hero.unit{min-height:0}
    .hero.unit .art{position:relative}
    .thrchip{white-space:nowrap}
    .hero .dl{position:relative;padding:16px 14px}
    .hero.unit .hfade{background:rgba(7,20,44,.74)}
    .dpills{gap:8px}
    .pon,.ptime{padding:4px 10px;font-size:13px}
    .dplate{font-size:34px}

  // интервалы усреднения
  function bucketize(pts, stepSec) {
    var mn = num(cfg.min), mx = num(cfg.max), map = new Map(), order = [];
    pts.forEach(function (p) {
      var k = Math.floor(p.t / stepSec) * stepSec, b = map.get(k);
      if (!b) { b = { t: k, s1: 0, n1: 0, s2: 0, n2: 0, lo1: null, hi1: null, lo2: null, hi2: null }; map.set(k, b); order.push(k); }
      if (p.v1 !== null) { b.s1 += p.v1; b.n1++; b.lo1 = b.lo1 === null ? p.v1 : Math.min(b.lo1, p.v1); b.hi1 = b.hi1 === null ? p.v1 : Math.max(b.hi1, p.v1); }
      if (p.v2 !== null) { b.s2 += p.v2; b.n2++; b.lo2 = b.lo2 === null ? p.v2 : Math.min(b.lo2, p.v2); b.hi2 = b.hi2 === null ? p.v2 : Math.max(b.hi2, p.v2); }
    });
    var d1 = [], d2 = [], bad = [];
    var worst = function (lo, hi) {
      if (mn !== null && lo !== null && lo < mn) return lo;
      if (mx !== null && hi !== null && hi > mx) return hi;
      return null;
    };
    order.sort(function (a, b) { return a - b; }).forEach(function (k) {
      var b = map.get(k), x = (k + stepSec / 2) * 1000;
      if (b.n1) d1.push({ x: x, y: Math.round(b.s1 / b.n1 * 10) / 10, lo: b.lo1, hi: b.hi1 });
      if (b.n2) d2.push({ x: x, y: Math.round(b.s2 / b.n2 * 10) / 10, lo: b.lo2, hi: b.hi2 });
      var w1 = worst(b.lo1, b.hi1), w2 = worst(b.lo2, b.hi2);
      if (w1 !== null) bad.push({ x: x, y: w1, s: "T1" });
      if (w2 !== null) bad.push({ x: x, y: w2, s: "T2" });
    });
    return { d1: d1, d2: d2, bad: bad };
  }

    var a = byName(cfg.n1), b = byName(cfg.n2);
    var notEngine = function (s) { return !/двиг|мотор|engine|coolant|охлаж|антифр|масл|oil|mühərrik|muherrik|antifriz|yağ|soyuducu maye/i.test(s.n); };
    var temps = list.filter(function (s) { return (s.t === "temperature" || /temp|темп/i.test(s.n)) && notEngine(s); })
                    .sort(function (x, y) { return x.id - y.id; });
    if (!a) a = temps.filter(function (s) { return s !== b; })[0] || null;
    if (!b) b = temps.filter(function (s) { return s !== a; })[0] || null;
    return [a, b];
  }
  function pickType(u, type) { return sensorList(u).filter(function (s) { return s.t === type; }).sort(function (x, y) { return x.id - y.id; })[0] || null; }

  function calc(u, s, msg) {
    if (!s || !msg) return null;
    var v;
    try { v = u.calculateSensorValue(s, msg); } catch (e) { return null; }
    if (v === null || v === undefined || isNaN(v) || Math.abs(v - INVALID) < 0.01) return null;
    return Math.round(v * 10) / 10;
  }

  function extras(rec, msg) {
    var ex = {};
    if (msg.pos) { ex.lat = msg.pos.y; ex.lon = msg.pos.x; ex.spd = msg.pos.s; }
    if (rec.fs) { ex.fuel = calc(rec.u, rec.fs, msg); ex.fuelU = rec.fs.m || ""; }
    if (rec.vs) ex.volt = calc(rec.u, rec.vs, msg);
    else if (msg.p && msg.p.pwr_ext !== undefined) ex.volt = +msg.p.pwr_ext;
    return ex;
  }

  function startLive() {
    var sid = qs.get("sid");
    var hash = qs.get("authHash") || qs.get("access_hash");
    var base = (qs.get("baseUrl") || qs.get("hostUrl") || "https://hst-api.wialon.com").replace(/\/+$/, "");
    var sc = document.createElement("script");
    sc.src = base + "/wsdk/script/wialon.js";
    sc.onload = function () { login(base, sid, hash); };
    sc.onerror = function () { status("err_sdk", "err"); };
    document.head.appendChild(sc);
  }

  function login(base, sid, hash) {
    var sess = wialon.core.Session.getInstance();
    sess.initSession(base, "topcontrol_temp");
    var done = function (code) {
      if (code) {
        status("err_login", "err", wialon.core.Errors.getErrorText(code) + " — " + T("reopen"));
        delete P.sid; delete P.authHash; delete P.access_hash; saveP();
        return;
      }
      try { var nsid = sess.getId(); if (nsid) { P.sid = nsid; delete P.authHash; delete P.access_hash; saveP(); } } catch (e) {}
      try { var u = sess.getCurrUser(); if (u) setUser(u.getName()); } catch (e) {}
      loadUnits(sess);
    };
    if (hash) sess.loginAuthHash(hash, done);
    else sess.duplicate(sid, qs.get("user") || "", true, done);
  }

  function loadUnits(sess) {
    sess.loadLibrary("unitSensors");
    var flags = wialon.item.Item.dataFlag.base | wialon.item.Unit.dataFlag.sensors | wialon.item.Unit.dataFlag.lastMessage;
    sess.updateDataFlags([{ type: "type", data: "avl_unit", flags: flags, mode: 0 }], function (code) {
      if (code) { status("err_units", "err", wialon.core.Errors.getErrorText(code)); return; }
      var list = sess.getItems("avl_unit") || [];
      list.forEach(function (u) {
        var ss = pickSensors(u);
        if (!ss[0] && !ss[1]) return;
        var rec = newRec(u.getId(), u.getName());
        rec.u = u; rec.ss = ss; rec.fs = pickType(u, "fuel level"); rec.vs = pickType(u, "voltage");
        rec.sn1 = ss[0] ? ss[0].n : "—"; rec.sn2 = ss[1] ? ss[1].n : "—";
        units.set(rec.id, rec);
        var onMsg = function (msg, initial) {
          if (!msg || !msg.t) return;
          handle(rec, msg.t, calc(u, ss[0], msg), calc(u, ss[1], msg), initial, extras(rec, msg));
        };
        u.addListener("messageRegistered", function (e) { onMsg(e.getData(), false); });
        u.addListener("changeLastMessage", function () { onMsg(u.getLastMessage(), false); });
        onMsg(u.getLastMessage(), true);
      });
      status("st_online", "");
      draw();
      setInterval(function () { draw(); if (sel) fillDet(); }, 30000);
    });
  }

  // seçilmiş maşının tarixçəsi (yalnız data-mesajlar)
  function loadHist(rec, from, to, cb) {
    try {
      var ml = wialon.core.Session.getInstance().getMessagesLoader();
      ml.loadInterval(rec.id, from, to, 0, 0xFF00, 50000, function (code, data) {
        if (code) { cb(null, wialon.core.Errors.getErrorText(code)); return; }
        var n = (data && data.count) || 0;
        if (!n) { cb([]); return; }
        ml.getMessages(0, n - 1, function (c2, msgs) {
          if (c2) { cb(null, wialon.core.Errors.getErrorText(c2)); return; }
          var pts = (msgs || []).map(function (m) { return { t: m.t, v1: calc(rec.u, rec.ss[0], m), v2: calc(rec.u, rec.ss[1], m) }; })
                                .filter(function (p) { return p.v1 !== null || p.v2 !== null; });
          try { ml.unload(function () {}); } catch (e) {}
          cb(pts);
        });
      });
    } catch (e) { cb(null, e.message); }
  }

  var geoBusy = false;
  function geocode(r) {
    var ex = r.ex || {};
    if (mode === "demo" || geoBusy || !ex.lat || typeof wialon === "undefined") return;
    var now = Date.now();
    if (r.addrAt && now - r.addrAt < 60000 && Math.abs(r.addrLat - ex.lat) < 0.002 && Math.abs(r.addrLon - ex.lon) < 0.002) return;
    geoBusy = true; r.addrAt = now; r.addrLat = ex.lat; r.addrLon = ex.lon;
    try {
      wialon.util.Gis.getLocations([{ lon: ex.lon, lat: ex.lat }], function (code, data) {
        geoBusy = false;
        if (!code && data && data[0]) { r.addr = data[0]; if (sel === r) { $("lVal").textContent = r.addr; $("lVal").title = r.addr; } }
      });
    } catch (e) { geoBusy = false; }
  }

  /* ================= Demo rejim ================= */
  function demoHist(r, from, to, cb) {
    setTimeout(function () {
      var pts = [], v1 = r._base + 1.5, v2 = r._base + 1, step = Math.max(60, rangeH * 3600 / 600);
      for (var t = from; t <= to; t += step) {
        var ph = (t % 86400) / 86400 * Math.PI * 2;
        v1 += (r._base + 1.2 + Math.sin(ph * 3) * 1.2 - v1) * 0.15 + (Math.random() - 0.5) * 0.5;
        v2 += (r._base + 0.8 + Math.cos(ph * 2) * 1.0 - v2) * 0.15 + (Math.random() - 0.5) * 0.5;
        pts.push({ t: Math.floor(t), v1: +v1.toFixed(1), v2: r.id === 6 ? null : +v2.toFixed(1) });
      }
      cb(pts);
    }, 350);
  }

  function startDemo() {
    mode = "demo";
    status("demo", "demo");
    setUser(T("demo_user"));
    var names = ["10-AB-123", "90-RT-456", "77-KL-208", "10-ZX-771", "99-MN-034", "90-QE-519", "10-HB-902", "77-PS-640", "10-CD-315", "90-FG-882", "77-JK-117", "99-UV-450"];
    var now = Math.floor(Date.now() / 1000);
    var recs = names.map(function (n, i) {
      var rec = newRec(i + 1, n);
      rec.sn1 = "Temp kamera"; rec.sn2 = "Temp qapı";
      units.set(rec.id, rec);
      rec._base = i === 2 || i === 6 ? 2.2 : 3 + Math.random() * 3;
      rec._v1 = rec._base + Math.random(); rec._v2 = rec._base + Math.random();
      rec._fuel = 40 + Math.random() * 55; rec._lat = 40.37 + Math.random() * 0.1; rec._lon = 49.8 + Math.random() * 0.15;
      rec.addr = "Bakı, Azərbaycan";
      handle(rec, now - Math.floor(Math.random() * 300), +rec._v1.toFixed(1), i === 5 ? null : +rec._v2.toFixed(1), true,
        { fuel: rec._fuel, fuelU: "%", volt: 26.8 + Math.random(), spd: Math.random() * 70, lat: rec._lat, lon: rec._lon });
      return rec;
    });
    function tick() {
      var r = recs[Math.floor(Math.random() * recs.length)];
      r._v1 = Math.max(-4, Math.min(10, r._v1 + (r._base - r._v1) * 0.2 + (Math.random() - 0.5) * 1.6));
      r._v2 = Math.max(-4, Math.min(10, r._v2 + (r._base - r._v2) * 0.2 + (Math.random() - 0.5) * 1.6));
      r._fuel = Math.max(5, r._fuel - Math.random() * 0.05);
      handle(r, Math.floor(Date.now() / 1000) + Math.random(), +r._v1.toFixed(1), r.id === 6 ? null : +r._v2.toFixed(1), false,
        { fuel: r._fuel, fuelU: "%", volt: 26.8 + Math.random(), spd: Math.random() * 70, lat: r._lat, lon: r._lon });
    }
    for (var k = 0; k < 60; k++) tick();
    setInterval(tick, 900);
    draw();
  }

  applyLang();
  var initHash = (location.hash || "").slice(1);
  showPage(initHash.indexOf("car-") === 0 ? "mon" : (initHash || "mon"));
  if (qs.get("sid") || qs.get("authHash") || qs.get("access_hash")) startLive(); else startDemo();
  applyLang();
})();
</script>
